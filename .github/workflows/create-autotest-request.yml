name: Create Autotest Request for Feature PRs

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  create-autotest-request:
    if: github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD --stat > diff_stat.txt
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- \
            'packages/ketcher-core/src/**' \
            'packages/ketcher-react/src/**' \
            'packages/ketcher-macromolecules/src/**' \
            'packages/ketcher-standalone/src/**' \
            | head -500 > diff_content.txt

      - name: Generate autotest request with Claude
        uses: anthropics/claude-code-action@beta
        with:
          prompt: |
            You are an QA automation engineer for Ketcher — an open-source web-based chemical structure editor (TypeScript, React, Redux, SVG rendering).

            A new feature PR has been labeled for autotest coverage:

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Author: ${{ github.event.pull_request.user.login }}
            Branch: ${{ github.event.pull_request.head.ref }}

            PR Description:
            ${{ github.event.pull_request.body }}

            Changed files summary (diff_stat.txt):
            $(cat diff_stat.txt)

            Key source changes (diff_content.txt — first 500 lines):
            $(cat diff_content.txt)

            Your tasks:
            1. Read a few existing autotest spec files in `ketcher-autotests/tests/specs/` to understand the project's test style and what is already covered.
            2. Analyze the PR changes to understand exactly what the new feature does and what user-visible behavior changed.
            3. Create a GitHub Issue using the following format (matching the project's autotest_request template):

               Title: "Autotests: ${{ github.event.pull_request.title }}"
               Labels: Autotests
               Body:
               ```
               **Source task(s):**
                - #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

               **Feature summary:**
               <1-2 sentence description of what the feature does>

               **Test scenarios to cover:**
               - [ ] <scenario 1>
               - [ ] <scenario 2>
               ...

               **Files likely to change in ketcher-autotests:**
               - `tests/specs/<Category>/<feature-name>.spec.ts` (new file)
               - `tests/pages/<Category>/<PageObject>.ts` (if new UI elements involved)

               **Test data needed:**
               - <list any mol/cdx/fasta files needed for test-data/>

               **Notes:**
               <chemistry-specific considerations, edge cases, stereochemistry, macromolecule concerns if applicable>
               ```
            4. After creating the issue, post a comment on PR #${{ github.event.pull_request.number }} linking to the created issue:
               "🧪 Autotest request created: <issue-link>. Review the scenarios and then comment `@claude implement autotests <issue-number>` on this PR to generate the implementation."

            Use `gh issue create` and `gh pr comment` via Bash to create the issue and comment.
          allowed_tools: "Bash,Read,Glob,Grep"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
