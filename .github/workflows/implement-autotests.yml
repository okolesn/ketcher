name: Implement Autotests

# Trigger: comment "@claude implement autotests" on an issue with 'Autotests' label
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read # Required for Claude to read CI results on PRs

jobs:
  implement-autotests:
    # Only run on issue comments where the issue has the 'Autotests' label
    if: |
      contains(github.event.issue.labels.*.name, 'Autotests') &&
      contains(github.event.comment.body, '@claude implement autotests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get autotest request details
        id: issue
        run: |
          gh issue view ${{ github.event.issue.number }} --json title,body > autotest_issue.json
          ISSUE_TITLE=$(gh issue view ${{ github.event.issue.number }} --json title --jq '.title')
          echo "title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          cat autotest_issue.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Implement autotests with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are implementing Playwright autotests for Ketcher.

            Autotest request issue: #${{ github.event.issue.number }} — ${{ steps.issue.outputs.title }}

            Issue details:
            $(cat autotest_issue.json)

            ## Your task

            Implement all test scenarios from the autotest request.

            ## After implementing

            Create and push the branch with your changes:
            1. `git checkout -b autotests/issue-${{ github.event.issue.number }}`
            2. `git add ketcher-autotests/`
            3. `git commit -m "Autotests: ${{ steps.issue.outputs.title }}"`
            4. `git push origin "autotests/issue-#${{ github.event.issue.number }} - ${{ steps.issue.outputs.title }}"`

            Stop after pushing. Do NOT create a PR or post any comments — those steps are handled by the workflow.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        id: create_pr
        run: |
          PR_URL=$(gh pr create \
            --title "#${{ github.event.issue.number }} - ${{ steps.issue.outputs.title }}" \
            --body "Implements autotests for #${{ github.event.issue.number }}" \
            --head "autotests/issue-#${{ github.event.issue.number }} - ${{ steps.issue.outputs.title }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Autotest PR created: ${{ steps.create_pr.outputs.pr_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}