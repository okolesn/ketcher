name: Implement Autotests

# Trigger: comment "@claude implement autotests" on an issue with 'Autotest' label
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement-autotests:
    # Only run on issue comments where the issue has the 'Autotest' label
    if: |
      contains(github.event.issue.labels.*.name, 'Autotest') &&
      contains(github.event.comment.body, '@claude implement autotests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get autotest request details
        id: issue
        run: |
          gh issue view ${{ github.event.issue.number }} --json title,body > autotest_issue.json
          ISSUE_TITLE=$(gh issue view ${{ github.event.issue.number }} --json title --jq '.title')
          echo "title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          cat autotest_issue.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Implement autotests with Claude
        uses: anthropics/claude-code-action@beta
        with:
          prompt: |
            You are implementing Playwright autotests for Ketcher.
            
            Autotest request issue: #${{ github.event.issue.number }} — ${{ steps.issue.outputs.title }}

            Issue details:
            $(cat autotest_issue.json)

            ## Your task

            Implement all test scenarios from the autotest request.

            ## After implementing

            1. Create a new branch named `autotests/issue-${{ github.event.issue.number }}` from the current branch.
            2. Commit all new/changed files with message: `Autotests: ${{ steps.issue.outputs.title }}`
            3. Push the branch and open a PR targeting the default branch with:
               - Title: `Autotests: ${{ steps.issue.outputs.title }}`
               - Body referencing the autotest request issue #${{ github.event.issue.number }}
            4. Post a comment on issue #${{ github.event.issue.number }} with a link to the new autotest PR.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
